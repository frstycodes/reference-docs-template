  <!-- Pact, from withpact.com/favicon.svg. A NAMED SOURCE, like #i-slack —
       not the tracker chip, which stays the generic #i-bead because a
       tracker is not always Pact and one vendor's logo must not stand in
       for the category.

       The source file paints itself with a <style> block and a
       prefers-color-scheme query; both are dropped. A `path { fill: … }`
       rule inside an inlined sprite is not scoped to the sprite — it would
       repaint every path on the page — and the dark-mode half is moot in a
       dark-only document. `fill="currentColor"` does the same job, and lets
       the mark take the ink of whatever it sits in. -->
